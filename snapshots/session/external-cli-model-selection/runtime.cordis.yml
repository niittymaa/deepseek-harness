# Exercise the real CLI adapter with a deterministic empty response and quota diagnostic.
# Directory context and its consumers are outside this response-only composition.
- id: llm-replay
  disabled: true
- id: llm-external-cli
  config:
    providers:
      deepseek-official:
        command: node
        cliType: custom
        args: ['-e', 'process.stdin.resume(); process.stdin.on("end", () => process.stderr.write(process.argv.slice(1).join(" ")))', '--']
        modelArgs: ['{model}']
        effortArgs: ['{effort}']
        models:
          - id: selected-cli-model
            reasoningEfforts:
              high: deep
- insert:
    - id: cli-selection-driver
      name: './cli-selection-driver.mjs'
- id: tool-bash
  disabled: true
- id: working-directory
  disabled: true
- id: tool-working-directory
  disabled: true
